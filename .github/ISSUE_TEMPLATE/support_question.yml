name: Support question
description: Ask how to use or configure something
title: "[Question]: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to accomplish?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit SHA
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - Node:
        - Package manager:
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What have you already tried?
      description: Include the documentation and searches you have already checked.
      render: shell