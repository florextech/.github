name: Ideas
title: "[Idea] "
labels: ["enhancement", "discussion"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What could be built, and for whom?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Why does this matter? What breaks today without it?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else could solve this?